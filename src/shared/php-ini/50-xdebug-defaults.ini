; ---------------------------------------------------------------------------
; 50-xdebug-defaults.ini - Xdebug fine-tuning
; ---------------------------------------------------------------------------
; These four values are harmless, only take effect when Xdebug is active,
; and are otherwise silently unused.
;
; Deliberately NOT in the .env: they are output fine-tuning, not an
; operational parameter. To change them, add a separate ini with a higher
; number in conf.d.
;
; Number 50: loads after the image's extension inis and before the
; runtime-generated 99-runtime-config.ini, which can override these
; defaults.
; ---------------------------------------------------------------------------
xdebug.max_nesting_level = 256
xdebug.var_display_max_depth = 3
xdebug.var_display_max_children = 128
xdebug.var_display_max_data = 512
