; ---------------------------------------------------------------------------
; 50-xdebug-defaults.ini — Xdebug-Feinjustierung
; ---------------------------------------------------------------------------
; Uebernommen aus phpcli/src/xdebug.ini:12-15. Diese vier Werte gab es nur im
; CLI-Bestand; phpfpm kannte sie nicht. Die Drift wird zugunsten der reicheren
; Variante aufgeloest: die
; Werte sind harmlos, wirken nur bei aktivem Xdebug und gehen sonst beim
; Konsolidieren still verloren.
;
; Sie stehen bewusst NICHT in der .env: sie sind Feinjustierung der Ausgabe, kein
; Betriebsparameter. Wer sie doch aendern will, haengt eine eigene INI mit
; hoeherer Nummer in conf.d.
;
; Nummer 50: laedt nach den Extension-INIs des Images und vor der zur Laufzeit
; erzeugten 99-runtime-config.ini — die Laufzeit schlaegt damit diese Defaults.
; ---------------------------------------------------------------------------
xdebug.max_nesting_level = 256
xdebug.var_display_max_depth = 3
xdebug.var_display_max_children = 128
xdebug.var_display_max_data = 512
