# Internal health endpoint for the web image, loopback only. Proxies to
# FPM's ping (pool config sets ping.path/ping.response), so a 200 "pong"
# proves nginx AND fpm. Static on purpose: no template variable may break
# the healthcheck.
server {
    listen 127.0.0.1:8081;

    location = /ping {
        access_log off;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_NAME /ping;
        fastcgi_param SCRIPT_FILENAME /ping;
    }
}
