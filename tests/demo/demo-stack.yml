# =============================================================================
# Demo stack — mariadb + phpfpm + official nginx
# =============================================================================
# Shows the intended path for consuming projects: this repo provides the PHP
# runtime and the nginx template; the web server and database are UNCHANGED
# official images. Nothing is built here — no build: section, no custom
# entrypoint, no custom nginx image.
#
# -----------------------------------------------------------------------------
# USAGE
# -----------------------------------------------------------------------------
#   make demo-up       start
#   make demo-down     tear down
#
# Without make:
#
#   docker compose -f tests/demo/demo-stack.yml --project-directory . up -d --wait
#
# --project-directory is required: without it, Compose treats tests/demo/ as
# the project directory, looks for a .env there that doesn't exist, and every
# variable ends up empty. All paths in this file are therefore written from
# the repo root. Values come from the .env at the repo root — nothing here is
# a second copy, so there is no ${VAR:-default} in this file.
#
# -----------------------------------------------------------------------------
# WHICH phpfpm IMAGE
# -----------------------------------------------------------------------------
# The reference below is the one a consuming project would write:
# headgent/phpfpm:<ver>. Until the new image series is published, `make
# demo-up` instead points DOCKER_HUB at the locally built test images. Once
# published, the reference above applies literally.
# =============================================================================

name: php-image-builder-demo

services:

  # ---------------------------------------------------------------------------
  # Database — official image, unchanged
  # ---------------------------------------------------------------------------
  db:
    image: mariadb:${MARIADB_VERSION}
    environment:
      MARIADB_ROOT_PASSWORD: ${DEMO_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DEMO_DB_NAME}
      MARIADB_USER: ${DEMO_DB_USER}
      MARIADB_PASSWORD: ${DEMO_DB_PASSWORD}
    # The demo database goes away with the stack. A named volume would survive
    # `docker compose down` and silently hand the next run a stale state.
    # Anyone needing persistence replaces tmpfs with a volume on
    # /var/lib/mysql.
    tmpfs:
      - /var/lib/mysql
    # The official image ships healthcheck.sh; --innodb_initialized only goes
    # green once the database actually answers queries — a bare "port open"
    # would be too early during the first-start initialization.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # PHP-FPM — this repo's image
  # ---------------------------------------------------------------------------
  # The service is named `app` because FASTCGI_UPSTREAM in nginx-defaults.env
  # defaults to exactly that. Renaming it means updating the variable on the
  # web server too, or nginx won't find the upstream at startup.
  app:
    image: ${DOCKER_HUB}/${IMAGE_NAME_FPM}:${PHP_VERSION}
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The one environment switch. The profile sets Xdebug, PCOV, OPcache,
      # JIT and error display together; the demo page displays the result.
      APP_ENV: ${APP_ENV}
      # Database access. The host is the service name.
      DEMO_DB_HOST: db
      DEMO_DB_NAME: ${DEMO_DB_NAME}
      DEMO_DB_USER: ${DEMO_DB_USER}
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD}
    volumes:
      # The application code. Mounted writable because a real application
      # stores cache and logs here; the entrypoint aligns appuser with this
      # directory's owner.
      - ./tests/demo/app:${APP_ROOT}
    # No healthcheck: block — the image ships its own (FastCGI ping against
    # its own pool, src/fpm/Dockerfile). Satisfied without repeating it here.

  # ---------------------------------------------------------------------------
  # Web server — official image, unchanged
  # ---------------------------------------------------------------------------
  web:
    image: nginx:${NGINX_VERSION}-alpine
    depends_on:
      app:
        # Not just service_started: nginx resolves the upstream name at
        # startup and exits if it can't find it.
        condition: service_healthy
    env_file:
      # The eleven template variables with their defaults. envsubst has no
      # default syntax — without this file, unresolved placeholders stay in
      # place and nginx refuses to start.
      - ./tests/nginx/nginx-defaults.env
    environment:
      # Set exemplarily. environment overrides env_file, same precedence
      # direction as for the PHP values.
      #
      # Only what a consuming project actually decides here is set. Everything
      # else (APP_ROOT, DOCUMENT_ROOT, INDEX_FILE, FASTCGI_UPSTREAM, PHP_PORT,
      # CLIENT_MAX_BODY_SIZE, the three timeouts) comes from the defaults file
      # and applies unchanged here.
      HOST: localhost
      # http = no upstream TLS proxy: HTTPS isn't passed through at all, and
      # the application builds http URLs. Behind Traefik & co. this would be
      # https — one switch that flips HTTPS, REQUEST_SCHEME and
      # HTTP_X_FORWARDED_PROTO together.
      REQUEST_SCHEME: http
    volumes:
      - ./tests/nginx/templates:/etc/nginx/templates:ro
      # nginx only reads — which is why it needs no image of its own: reading
      # requires no UID alignment.
      - ./tests/demo/app:${APP_ROOT}:ro
    ports:
      - "${DEMO_HTTP_PORT}:80"
    # The official nginx image ships no healthcheck. A static file is checked
    # here rather than the front controller: this service should report its
    # own availability, not php-fpm's — the app service reports that itself.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health.txt"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
