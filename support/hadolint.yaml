# hadolint configuration for all Dockerfiles in this repo: src/base, src/cli,
# and src/fpm. Each ignore below is a deliberate choice, not an oversight.
ignored:
  # DL3018 (pin apk versions): these packages follow the pinned ALPINE_VERSION
  # build-arg, so pinning each library individually would be brittle and defeats
  # the point of a base image that must stay current with security patches.
  - DL3018
  # DL4006 (set pipefail before a piped RUN): the only pipe is
  # `yes "" | pecl install`, and its left side cannot meaningfully fail.
  - DL4006
