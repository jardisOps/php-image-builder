# =============================================================================
# ci.yml — the single CI workflow
# =============================================================================
# Builds and tests both PHP images (cli, fpm) across the PHP version matrix:
# a keepalive job for the scheduled trigger, a build-and-test guard for every
# push and pull request, and a blocking Trivy CVE gate.
#
# -----------------------------------------------------------------------------
# WHO IS ALLOWED TO PUBLISH
# -----------------------------------------------------------------------------
# Only the monthly schedule and a manual workflow_dispatch, and only while the
# repository variable PUBLISH_ENABLED holds 'true'. It currently holds 'false'.
#
# A push to main deliberately cannot publish, no matter what the variable says.
# Publishing overwrites the floating :<ver> and :latest tags that running
# projects pull — it is the one step in this project with external effect, and
# it must not ride along on an incidental commit. Splitting the two is what
# lets the switch stay on so the monthly run can do its job: keep the
# published base-image patch level current on its own.
#
# Turning the switch on is a deliberate act. Local `make push` / `push-all`
# stay out of it entirely — they are for an approved, manual publish.
# =============================================================================
name: Build, Test and Push PHP Images

on:
  # php_versions narrows the publish matrix for a deliberate, staged rollout —
  # e.g. bring :8.3 back first, check it, then the rest. It affects ONLY the
  # publish job; lint and build-test always cover the whole matrix. The
  # scheduled run has no inputs and falls back to the default, so it publishes
  # all three.
  workflow_dispatch:
    inputs:
      php_versions:
        description: 'PHP versions to publish, JSON array'
        required: false
        default: '["8.3","8.4","8.5"]'
  schedule:
    # Monthly on the 1st at 02:00 UTC. Cron cannot express "every four weeks":
    # a day-of-month step like */28 fires on the 1st and the 29th, so the gap
    # jumps between 28 and 3 days. Monthly is the closest regular interval and
    # keeps the base-image patch level under a fixed cadence.
    - cron: '0 2 1 * *'
  push:
    branches:
      - main
    # This list appears twice because GitHub Actions does not resolve YAML
    # anchors here — a &anchor/*ref would silently disable the path filter
    # instead of being reused. Keep both copies identical and edit them
    # together.
    paths:
      - '.env'
      - 'src/**'
      - 'tests/**'
      - 'support/**'
      - 'Makefile'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '.env'
      - 'src/**'
      - 'tests/**'
      - 'support/**'
      - 'Makefile'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
      - '!**/*.md'

# A superseded build guard should be cancelled; a run that is pushing to the
# registry must not be. Both halves are needed for that: the trigger is part
# of the group, so a commit landing on main cannot cancel a scheduled publish
# — cancel-in-progress is a property of the ARRIVING run, and without the
# split the commit would take the publish down with it. And only push and
# pull_request cancel at all, so a second dispatch waits for the first instead
# of interrupting a `--push` halfway through its manifest.
concurrency:
  group: ${{ github.ref }}-${{ github.event_name }}-build
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

# Baseline permissions for all jobs; individual jobs extend them below.
permissions:
  contents: read

jobs:
  # ===========================================================================
  # keepalive — reset GitHub's 60-day inactivity switch
  # ===========================================================================
  # Without it, the scheduled rebuild eventually gets disabled for inactivity.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable workflow (keepalive)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/ci.yml/enable

  # ===========================================================================
  # lint — static checks, no image needed
  # ===========================================================================
  # Runs via `make test-static` (test-lint + test-bake) rather than a
  # dedicated action: the list of Dockerfiles and shell files stays in one
  # place (support/makefiles/test.mk) and applies locally and in CI alike.
  # Both stages are PHP-version-independent, so this runs once for all three
  # matrix jobs below instead of once per job.
  #
  # test-bake belongs here because it builds nothing: it checks the resolved
  # bake definition — every published target depends on `base` for its own PHP
  # version, so a base change rebuilds all dependent targets.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Static checks (hadolint, shellcheck, bake definition)
        run: make test-static

  # ===========================================================================
  # build-test — one PHP version per job
  # ===========================================================================
  # This is where the Linux-only proof happens that macOS runners can't
  # provide: `make test-image-suite` includes test-uid (real Docker volumes)
  # and test-uid-linux (a real bind mount). The version-independent stages ran
  # once already, in the lint job above.
  #
  # Native amd64, no emulation: booting an arm64 image on this amd64 runner
  # would mean QEMU, which is slow and prone to hanging without a timeout
  # under `--load`. The publish job verifies the arm64 build during its
  # multi-arch build.
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: ['8.3', '8.4', '8.5']
      fail-fast: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      # -----------------------------------------------------------------------
      # The layer cache only works with these three variables
      # -----------------------------------------------------------------------
      # BuildKit's `type=gha` cache needs ACTIONS_RUNTIME_TOKEN and the cache
      # service URL. The runner hands those to JavaScript actions only, never
      # to a `run:` step — and buildx then drops --cache-from/--cache-to
      # silently: no import, no export, no error. That is why every extension
      # was recompiled in run 30236711245 although both jobs asked for the
      # cache. docker/build-push-action injects them itself; a direct
      # `docker buildx bake` out of the Makefile does not get them.
      #
      # ACTIONS_CACHE_URL — the legacy v1 endpoint — is deliberately NOT among
      # them, even where the runner still sets it. Exporting it makes buildx
      # fill in the v1 `url` attribute, and that endpoint answers with an HTML
      # error page: run 30241132642 died on `failed to parse error response
      # 400` in every import and export. ACTIONS_RESULTS_URL (v2) is the one
      # that answers. The three core.info lines record what the runner
      # actually offered, so the next change to this step argues from a
      # measurement instead of a guess.
      #
      # Only variables that actually carry a value are exported: an empty
      # ACTIONS_RUNTIME_TOKEN is worse than none at all — buildx would take it
      # for a real one and abort with "token is malformed". The token is
      # registered for log masking before it is exported, because from here on
      # it sits in the environment of ordinary `run:` steps in a public
      # repository. And if it is missing, the job says so: silence is what
      # made this defect invisible in the first place.
      - name: Expose the Actions cache credentials to buildx
        uses: actions/github-script@v9
        with:
          script: |
            for (const key of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              const value = process.env[key]
              if (!value) continue
              if (key === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value)
              core.exportVariable(key, value)
            }
            core.info(`ACTIONS_RESULTS_URL=${process.env.ACTIONS_RESULTS_URL || '(unset)'}`)
            core.info(`ACTIONS_CACHE_URL=${process.env.ACTIONS_CACHE_URL || '(unset)'} — deliberately not exported`)
            core.info(`ACTIONS_CACHE_SERVICE_V2=${process.env.ACTIONS_CACHE_SERVICE_V2 || '(unset)'}`)
            if (!process.env.ACTIONS_RUNTIME_TOKEN) {
              core.warning('ACTIONS_RUNTIME_TOKEN is missing — buildx discards the layer cache without an error, so this job rebuilds everything.')
            }

      # CACHE_SCOPE per PHP version and job: BuildKit's default is a single
      # shared namespace in which the matrix jobs overwrite each other. The
      # scheduled run reads nothing (CACHE_MODE=w) — it exists to pick up
      # patched base layers, and the stored cache is exactly what it must not
      # take.
      - name: Test run (PHP ${{ matrix.php_version }})
        run: |
          make test-image-suite PHP_VERSION=${{ matrix.php_version }} \
            CACHE_BACKEND=gha \
            CACHE_SCOPE=test-${{ matrix.php_version }} \
            CACHE_MODE=${{ github.event_name == 'schedule' && 'w' || 'rw' }}

      # -----------------------------------------------------------------------
      # Trivy — blocking CVE gate
      # -----------------------------------------------------------------------
      # Scans the TEST image before any push happens. It is not the pushed
      # artifact but a second object built from the same source: amd64 only,
      # without attestations, under its own name. Its filesystem layers match
      # the amd64 half of what publish pushes — only metadata differs, so what
      # a scanner reads, packages and their versions, is the same. The arm64
      # half is covered by nothing here: CI builds it but never boots or scans
      # it. Blocks only on CRITICAL/HIGH findings that
      # have a fix available (ignore-unfixed: true) — findings without a fix
      # can't be resolved and would block the pipeline forever, so they are
      # reported instead (next step) rather than dropped.
      - name: Trivy — blocking gate (fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: php-image-builder-test/phpcli:${{ matrix.php_version }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy — blocking gate, fpm
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: php-image-builder-test/phpfpm:${{ matrix.php_version }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # The rest — CVEs without an available fix. Doesn't block, but doesn't
      # disappear either: `if: always()` makes sure this report still runs
      # even if the gate above already failed.
      #
      # Only fpm, not cli too: both images are identical except for one
      # metadata layer (ENV, STOPSIGNAL, HEALTHCHECK, CMD), so a second report
      # would list the same findings. The gate above still runs against both.
      - name: Trivy — report on ALL CRITICAL/HIGH (including unfixable)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: php-image-builder-test/phpfpm:${{ matrix.php_version }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          output: trivy-full.txt

      - name: Add report to job summary
        if: always()
        run: |
          {
            echo "## Trivy — PHP ${{ matrix.php_version }}, all CRITICAL/HIGH"
            echo ""
            echo "The gate only blocks on fixable findings. This list also"
            echo "includes the ones that can't (yet) be fixed."
            echo '```'
            cat trivy-full.txt 2>/dev/null || echo "no report generated"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # publish — multi-arch build with push, SBOM and attestations
  # ===========================================================================
  # DISABLED, see the file header. Three conditions gate it together:
  #   vars.PUBLISH_ENABLED == 'true'   the master switch, currently 'false'
  #   schedule or workflow_dispatch    a commit never publishes, no matter
  #                                    what the switch says
  #   needs: [lint, build-test]        nothing publishes without passing the
  #                                    Trivy gate
  #
  # The trigger condition is what makes the master switch usable: with it,
  # PUBLISH_ENABLED can stay on permanently without every incidental commit to
  # main pushing the whole matrix. The monthly schedule then publishes the
  # patched base layers by itself — which is the entire point of running it.
  #
  # id-token: write + attestations: write apply to this job for both images.
  # SBOM and provenance attestation are produced during the build itself via
  # BUILD_ATTEST_FLAGS (support/makefiles/docker.helper.mk), not as a
  # follow-up step — they belong on the manifest that gets pushed.
  publish:
    needs: [lint, build-test]
    if: ${{ vars.PUBLISH_ENABLED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    strategy:
      # `inputs` is null for every trigger other than workflow_dispatch, so the
      # fallback is what schedule and push use.
      matrix:
        php_version: ${{ fromJSON(inputs.php_versions || '["8.3","8.4","8.5"]') }}
      fail-fast: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v4

      # Same reason and same script as in build-test: without these variables
      # buildx discards the cache flags without a word. The copy stands for
      # the same reason as the duplicated `paths:` list above — a workflow
      # cannot reuse a step, and a composite action would hide eight lines
      # behind a file of its own. Edit both together.
      - name: Expose the Actions cache credentials to buildx
        uses: actions/github-script@v9
        with:
          script: |
            for (const key of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              const value = process.env[key]
              if (!value) continue
              if (key === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value)
              core.exportVariable(key, value)
            }
            core.info(`ACTIONS_RESULTS_URL=${process.env.ACTIONS_RESULTS_URL || '(unset)'}`)
            core.info(`ACTIONS_CACHE_URL=${process.env.ACTIONS_CACHE_URL || '(unset)'} — deliberately not exported`)
            core.info(`ACTIONS_CACHE_SERVICE_V2=${process.env.ACTIONS_CACHE_SERVICE_V2 || '(unset)'}`)
            if (!process.env.ACTIONS_RUNTIME_TOKEN) {
              core.warning('ACTIONS_RUNTIME_TOKEN is missing — buildx discards the layer cache without an error, so this job rebuilds everything.')
            }

      # `make push` is a thin wrapper around support/docker-bake.hcl: platforms,
      # tag set and attestations live there in one place.
      # The namespace comes from DOCKER_HUB in .env — the single source of
      # configuration. It is deliberately NOT set from the login secret here:
      # as an environment variable it would have no effect at all, because the
      # Makefile's `include ./.env` overrides it, and the line would suggest a
      # control that does not exist. The account behind DOCKER_USER_NAME must
      # therefore have write access to that namespace.
      #
      # This job writes its own cache scope and reads the test job's on top:
      # a cache key is immutable, so a shared scope would let whichever job
      # finishes second lose its entry — here that would be the arm64 layers,
      # the ones that cost 46 of the 47 minutes. Reading `test-<ver>` is what
      # saves the second amd64 build; arm64 only ever comes from this job's
      # own scope, from an earlier run.
      - name: Build and push (PHP ${{ matrix.php_version }}, multi-arch)
        run: |
          make push PHP_VERSION=${{ matrix.php_version }} \
            CACHE_BACKEND=gha \
            CACHE_SCOPE=publish-${{ matrix.php_version }} \
            CACHE_READ_SCOPES=test-${{ matrix.php_version }} \
            CACHE_MODE=${{ github.event_name == 'schedule' && 'w' || 'rw' }}
