# =============================================================================
# ci.yml — the single CI workflow
# =============================================================================
# Builds and tests both PHP images (cli, fpm) across the PHP version matrix:
# a keepalive job for the scheduled trigger, a push guard for PRs (build and
# test, never publish), and a blocking Trivy CVE gate.
#
# -----------------------------------------------------------------------------
# PUBLISH DISABLED
# -----------------------------------------------------------------------------
# The publish job exists but is switched off: it only runs when the repository
# variable PUBLISH_ENABLED is 'true'. That variable does not exist, and
# creating it is a deliberate act.
#
# Reason: the first push to headgent/phpcli / headgent/phpfpm is the only step
# in this project with external effect — it overwrites the floating :<ver> and
# :latest tags that running projects pull. A tag strategy must be approved
# before that first run (see docs/TAG-STRATEGIE.md).
#
# Until then: no docker login, no --push, no CI trigger for it.
# =============================================================================
name: Build, Test and Push PHP Images

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 */3 * *'  # every three days at 02:00 UTC
  push:
    branches:
      - main
    # This list appears twice because GitHub Actions does not resolve YAML
    # anchors here — a &anchor/*ref would silently disable the path filter
    # instead of being reused. Keep both copies identical and edit them
    # together.
    paths:
      - '.env'
      - 'src/**'
      - 'tests/**'
      - 'support/**'
      - 'Makefile'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '.env'
      - 'src/**'
      - 'tests/**'
      - 'support/**'
      - 'Makefile'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
      - '!**/*.md'

concurrency:
  group: ${{ github.ref }}-build
  cancel-in-progress: true

# Baseline permissions for all jobs; individual jobs extend them below.
permissions:
  contents: read

jobs:
  # ===========================================================================
  # keepalive — reset GitHub's 60-day inactivity switch
  # ===========================================================================
  # Without it, the scheduled rebuild eventually gets disabled for inactivity.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable workflow (keepalive)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/ci.yml/enable

  # ===========================================================================
  # lint — static checks, no image needed
  # ===========================================================================
  # Runs via `make test-static` (test-lint + test-bake) rather than a
  # dedicated action: the list of Dockerfiles and shell files stays in one
  # place (support/makefiles/test.mk) and applies locally and in CI alike.
  # Both stages are PHP-version-independent, so this runs once for all three
  # matrix jobs below instead of once per job.
  #
  # test-bake belongs here because it builds nothing: it checks the resolved
  # bake definition — every published target depends on `base` for its own PHP
  # version, so a base change rebuilds all dependent targets.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Static checks (hadolint, shellcheck, bake definition)
        run: make test-static

  # ===========================================================================
  # build-test — one PHP version per job
  # ===========================================================================
  # This is where the Linux-only proof happens that macOS runners can't
  # provide: `make test-image-suite` includes test-uid (real Docker volumes)
  # and test-uid-linux (a real bind mount). The version-independent stages ran
  # once already, in the lint job above.
  #
  # Native amd64, no emulation: booting an arm64 image on this amd64 runner
  # would mean QEMU, which is slow and prone to hanging without a timeout
  # under `--load`. The publish job verifies the arm64 build during its
  # multi-arch build.
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: ['8.3', '8.4', '8.5']
      fail-fast: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Test run (PHP ${{ matrix.php_version }})
        run: make test-image-suite PHP_VERSION=${{ matrix.php_version }} CACHE_BACKEND=gha

      # -----------------------------------------------------------------------
      # Trivy — blocking CVE gate
      # -----------------------------------------------------------------------
      # Scans the TEST image, the exact artifact the publish job would push,
      # before any push happens. Blocks only on CRITICAL/HIGH findings that
      # have a fix available (ignore-unfixed: true) — findings without a fix
      # can't be resolved and would block the pipeline forever, so they are
      # reported instead (next step) rather than dropped.
      - name: Trivy — blocking gate (fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: php-image-builder-test/phpcli:${{ matrix.php_version }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy — blocking gate, fpm
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: php-image-builder-test/phpfpm:${{ matrix.php_version }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # The rest — CVEs without an available fix. Doesn't block, but doesn't
      # disappear either: `if: always()` makes sure this report still runs
      # even if the gate above already failed.
      #
      # Only fpm, not cli too: both images are identical except for one
      # metadata layer (ENV, STOPSIGNAL, HEALTHCHECK, CMD), so a second report
      # would list the same findings. The gate above still runs against both.
      - name: Trivy — report on ALL CRITICAL/HIGH (including unfixable)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: php-image-builder-test/phpfpm:${{ matrix.php_version }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          output: trivy-full.txt

      - name: Add report to job summary
        if: always()
        run: |
          {
            echo "## Trivy — PHP ${{ matrix.php_version }}, all CRITICAL/HIGH"
            echo ""
            echo "The gate only blocks on fixable findings. This list also"
            echo "includes the ones that can't (yet) be fixed."
            echo '```'
            cat trivy-full.txt 2>/dev/null || echo "no report generated"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # publish — multi-arch build with push, SBOM and attestations
  # ===========================================================================
  # DISABLED, see the file header. Three conditions gate it together:
  #   vars.PUBLISH_ENABLED == 'true'      the repository variable doesn't exist
  #   github.event_name != 'pull_request' push guard
  #   needs: [lint, build-test]           nothing publishes without passing
  #                                       the Trivy gate
  #
  # id-token: write + attestations: write apply to this job for both images.
  # SBOM and provenance attestation are produced during the build itself via
  # BUILD_ATTEST_FLAGS (support/makefiles/docker.helper.mk), not as a
  # follow-up step — they belong on the manifest that gets pushed.
  publish:
    needs: [lint, build-test]
    if: ${{ vars.PUBLISH_ENABLED == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: ['8.3', '8.4', '8.5']
      fail-fast: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v4

      # `make push` is a thin wrapper around support/docker-bake.hcl: platforms,
      # tag set and attestations live there in one place.
      - name: Build and push (PHP ${{ matrix.php_version }}, multi-arch)
        env:
          DOCKER_HUB: ${{ secrets.DOCKER_USER_NAME }}
        run: make push PHP_VERSION=${{ matrix.php_version }} CACHE_BACKEND=gha
